# Fly.io 배포 예시 템플릿입니다. 직접 배포하려면 app 이름을 자신의 고유한
# 이름으로 바꾸거나 `fly launch`로 새로 생성하세요 (Fly 앱 이름은 전역 유일).
app = "landscape-psis-mcp"
primary_region = "nrt"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[env]
  PORT = "3000"
  PSIS_SERVICE_TYPE = "AA001"
  REQUEST_TIMEOUT_MS = "15000"
  CACHE_ENABLED = "true"
  CACHE_TTL_MS = "21600000"
  CACHE_MAX_ENTRIES = "1000"
  RATE_LIMIT_ENABLED = "true"
  RATE_LIMIT_WINDOW_MS = "60000"
  RATE_LIMIT_MAX_PER_IP = "60"
  RATE_LIMIT_MAX_PER_KEY = "60"
  FIT_MAX_CANDIDATE_SEARCHES = "10"
  FIT_SEARCH_DISPLAY_COUNT = "10"
  FIT_MAX_RETURNED_ITEMS = "100"
  SAFE_ACCESS_LOG = "true"
