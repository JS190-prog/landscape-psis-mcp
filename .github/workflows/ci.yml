name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - name: Guard private operator files
        run: |
          tracked="$(git ls-files OPERATOR.md public src/local.js src/metrics.js)"
          if [ -n "$tracked" ]; then
            echo "Private operator files must not be tracked in the public repository."
            echo "$tracked"
            exit 1
          fi
      - run: npm test
